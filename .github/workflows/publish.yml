name: edit
on:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i '1a\
          \
          **Live demo:** https://kaleshai.streamlit.app' README.md
          git config user.name "Instinct Agent"
          git config user.email "agent@instinct.com"
          git add README.md
          git commit -m "README: add live demo link"
          git push
